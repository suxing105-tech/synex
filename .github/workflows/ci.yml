name: CI

# 为什么要这份文件：AGENTS.md §4.3 那五套门禁原先只在本机跑得起来，pre-commit 钩子还得
# 手动装一次（install-git-hooks.ps1，而且 .git\hooks 不入库）。换机器、换人、或者某一轮
# 就是没本地跑，全凭自觉——审查时就是这么攒下几百条 lint 意见和一个 3.12 才合法的写法的。
# 这里把 verify-all 里能自动化的四套（后端 / 前端 / 类型 / Rust）拆成三个 job 并行跑。
# 只测不打包：PyInstaller + NSIS 那一段留在本机，口径见 docs/release-process.md。
#
# 这份文件在 CI 上跑之前本地验不了，能本地取证的都取了：四套命令与目录照本机 verify-all 抄并且
# 本机全绿；rust 这一 job 少随包文件会连编译都进不去，那条已经在本机取证，结论写在它自己的步骤
# 里，名单由 backend/tests/test_ci_workflow.py 钉住。剩下没验的是 Actions 环境本身：choco 装的
# ffmpeg、pnpm 11 + node 24、空缓存下的 cargo 下载，以及 Windows runner 的耗时。
#
# 后端固定 Python 3.11，不用本机那台 3.14：pyproject 声明的是 >=3.11，而 repository.py
# 写过只有 3.12 才允许的 f-string 同引号嵌套——在本机永远跑得出绿，声明却是骗人的。
# test_python_floor.py 钉的就是这条下限。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# upload-artifact 要 actions:write。这里一直故意只给最小权限，加了 vitest 报告上传之后
# 就得把 actions:write 一起写上——漏了它，「留下失败名单」这一步自己会变成一个新的红点。
permissions:
  contents: read
  actions: write

jobs:
  backend:
    name: 后端 pytest
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 装后端依赖（dev extras 里有 pytest、pytest-asyncio、ruff、psd-tools）
        run: pip install -e ".[dev]"
        working-directory: backend

      # 没有 ffmpeg 时相关用例自己 skip，所以装不上不该把 CI 变红；装上了就真测海报与 PSNR。
      - name: 备 ffmpeg / ffprobe（可选）
        continue-on-error: true
        run: choco install ffmpeg --y --no-progress

      - name: pytest
        run: python -m pytest -q
        working-directory: backend

  frontend:
    name: 前端 vitest + svelte-check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 装依赖（锁文件是唯一来源，禁止 npm）
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # junit 报告是给自己看的：0.2.51 那次 CI 首跑红在 vitest，Actions 的日志界面会把中段截掉，
      # 本机按干净工作区 / CI=true / TZ=UTC / 4 worker 四种口径都复现不出红，最后连「哪几条
      # 用例红」都没拿到。失败名单得留在产物里，不该靠翻日志。
      - name: vitest
        run: pnpm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml
        working-directory: frontend

      # if: ${{ always() }} 是关键——红的那一次才是唯一需要这份报告的这一次
      - name: 上传 vitest 报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: frontend/test-results/vitest.xml
          if-no-files-found: warn
          retention-days: 14

      - name: svelte-check
        run: pnpm exec svelte-check --threshold error
        working-directory: frontend

  rust:
    name: Rust 壳 cargo test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # build.rs 调 tauri_build::build()，它要 frontend/dist 存在才过；本机一直有 dist，
      # 所以这一步在本地是隐形的，CI 里必须自己先构建前端。
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 前端产物（tauri build.rs 需要）
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: vite build
        run: pnpm build
        working-directory: frontend

      # tauri-build 在 build script 阶段就按 tauri.conf.json 把 externalBin 与 resources 逐个查
      # 存在性，缺一个 build.rs 直接 return Err，cargo test 连编译都进不去。本机实测：把这些文件
      # 从工作区挪走，cargo test 停在 build script，报
      #   resource path `binaries\python-backend-x86_64-pc-windows-msvc.exe` doesn't exist
      # 换成占位文件后同一条命令 50 passed / 2 ignored（取证日志 outputs/ci-rust-probe/）。
      # 全新 checkout 真正缺的只有三个 sidecar：它们由 PyInstaller 与 fetch-media-tools 现造，
      # .gitignore 里 binaries/*.exe 挡的就是它们；两份授权文本是入库的，列进来只为让名单与
      # tauri.conf.json 一致，Test-Path 会让已有的文件原样保留。本机一直在，所以看不见这个坑。
      # CI 不打安装包（发布仍在本机），所以这里只补「文件在不在」：cargo test 既不 spawn sidecar
      # （tests/ 只有 release_signature 与 updater_transport，sidecar.rs 的用例只算路径）也不读
      # 授权内容；真随包文件由 build-preview.ps1 / build-update.ps1 出。两个名单由
      # backend/tests/test_ci_workflow.py 对着 tauri.conf.json 双向钉死——加一个 sidecar 忘了同步
      # 这里，本机就红，不用等 CI 首跑。
      - name: 补 tauri-build 要的随包文件（CI 不打包）
        shell: pwsh
        run: |
          $triple = 'x86_64-pc-windows-msvc'
          $tauri = 'frontend/src-tauri'
          New-Item -ItemType Directory -Force -Path "$tauri/binaries", "$tauri/resources" | Out-Null
          foreach ($n in @('python-backend', 'ffmpeg', 'ffprobe')) {
            $p = "$tauri/binaries/$n-$triple.exe"
            if (-not (Test-Path -LiteralPath $p)) {
              New-Item -ItemType File -Force -Path $p | Out-Null   # tauri 只要这个路径存在，copy 而已
            }
          }
          foreach ($r in @('ffmpeg-LICENSE.txt', 'OFL-SeekX-Sans.txt')) {
            $p = "$tauri/resources/$r"
            if (-not (Test-Path -LiteralPath $p)) {
              Set-Content -LiteralPath $p -Encoding utf8 -Value 'CI placeholder: packaging happens locally, see docs/release-process.md'
            }
          }

      - uses: dtolnay/rust-toolchain@stable

      # 本机门禁跑的是 cargo test --offline，因为依赖早就在本地缓存里；
      # CI 是空缓存，--offline 会直接要不到 crate，所以先 fetch 再测。
      - name: cargo test
        run: cargo test
        working-directory: frontend/src-tauri
        env:
          CARGO_TERM_COLOR: always
